<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technical Office AI</title>
<meta name="theme-color" content="#152139">
<meta name="description" content="Technical Office AI demo: şantiye notlarından günlük rapor, tutanak; hakediş, metraj, keşif ve teklif.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teknik Ofis">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: kurumsal, sakin, güven veren bir teknik ofis aracı.
   IDEA: şantiye dosyası + resmi tutanak kâğıdı; ekran gerçek ürün gibi çalışır.
   PICTURE: uygulamanın kendisi — AI Asistan açılışta yarı kullanımda.
   COLOUR and TYPE: beyaz zemin, koyu lacivert #152139, gri, tek mavi vurgu #2f80ed; Inter.
   LAYOUT: solda lacivert menü, sağda içerik; 900px altında alt menü, tek kolon. */
:root{color-scheme:light dark;
--bg:light-dark(#f5f7fa,#0c1220);--card:light-dark(#ffffff,#141c2e);--ink:light-dark(#18202e,#e6ebf3);--mute:light-dark(#5f6b7d,#9aa6b8);
--line:light-dark(#e2e7ef,#243049);--navy:#152139;--navy2:#1f2f50;--soft:light-dark(#eef2f8,#1a2540);--accent:#2f80ed;--accent-ink:light-dark(#1956ad,#7fb2ff);
--amber-bg:light-dark(#fff7e6,#2c2412);--amber:light-dark(#8a5a00,#f3c56b);--green-bg:light-dark(#e9f8f0,#12291f);--green:light-dark(#107a4a,#6fdca6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--navy);color:#c7d2e6;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px;border-bottom:1px solid #ffffff1a}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{color:#fff;font-size:14px;display:block}.brand small{font-size:12px;color:#8fa0bd}
.nav{padding:12px;flex:1;overflow:auto}.nav p{font-size:11px;color:#7b8cab;margin:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#c7d2e6;text-decoration:none;font-size:14px}
.nav a:hover{background:#ffffff0d;color:#fff}.nav a.on{background:#ffffff1a;color:#fff;font-weight:600}
.nav a .soon{margin-left:auto;font-size:10px;background:#ffffff14;padding:1px 6px;border-radius:4px;color:#8fa0bd}
.nav svg,.bn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.me{padding:14px 18px;border-top:1px solid #ffffff1a;font-size:13px}.me b{color:#fff;display:block}
main{padding:24px clamp(16px,3vw,40px) 96px;max-width:1240px;width:100%}
.demo{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 14px;font-size:13px;margin-bottom:18px}
h1{font-size:clamp(24px,3vw,32px);line-height:1.1;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 22px}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.head .sub{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px #10182810}
.pad{padding:20px}.ch{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}.ch h2{font-size:15px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{padding:16px 18px}.stat small{color:var(--mute);font-size:12.5px}.stat b{display:block;font-size:26px;line-height:1.2}.stat i{font-style:normal;font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:20px}.grid-a{display:grid;grid-template-columns:2fr 3fr;gap:20px;align-items:start}
.list a,.row{display:flex;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.list a:first-child{border-top:0}.list a:hover{background:var(--soft)}.grow{flex:1}.list small,.row small{display:block;color:var(--mute);font-size:12.5px}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;white-space:nowrap;font-weight:500}.b-draft{background:var(--amber-bg);color:var(--amber)}.b-final{background:var(--green-bg);color:var(--green)}.b-blue{background:var(--soft);color:var(--accent-ink)}.b-gray{background:var(--soft);color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--navy2);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--navy)}.btn.ac{background:var(--accent)}.btn.ac:hover{background:#1f6ad6}.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.l{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
textarea.in{min-height:140px;resize:vertical;line-height:1.5}.f{margin-bottom:14px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ex{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--mute);cursor:pointer;margin-bottom:6px}.ex:hover{border-color:var(--accent);color:var(--ink)}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:12px 14px;font-size:13.5px}.warn ul{margin:6px 0 0;padding-left:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0 16px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;cursor:pointer;min-height:44px}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--soft)}.opt:disabled{opacity:.55;cursor:not-allowed}.opt b{font-size:14px;display:flex;justify-content:space-between;gap:8px}.opt small{color:var(--mute);font-size:12.5px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}th{font-size:12px;color:var(--mute);font-weight:600;border-top:0}
.qty td,.qty th{padding:6px 8px;font-size:13.5px}.num{text-align:right;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.steps{margin:10px 0 0;padding-left:20px;color:var(--mute);font-size:14px}
.spin{width:16px;height:16px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* Belge kâğıdı */
.paper{background:#fff;color:#1b2230;max-width:820px;margin:0 auto;padding:clamp(18px,5vw,48px);border-radius:6px;box-shadow:0 2px 14px #0f172a24;font-size:13px;line-height:1.55}
.ph{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2.5px solid #1f2f50;padding-bottom:10px}
.plogo{width:96px;height:44px;border:1px dashed #c5d1e6;border-radius:6px;display:grid;place-items:center;font-size:10px;color:#98aed2}
.ph div:last-child{text-align:right}.ph b{font-size:17px;color:#1f2f50}.ph small{display:block;font-size:10px;color:#6b7280}
.pt{text-align:center;margin:20px 0 14px}.pt h3{margin:0;font-size:19px;color:#1f2f50;letter-spacing:.02em}.pt p{margin:2px 0 0;color:#6b7280}
.paper table th,.paper table td{border:1px solid #c5d1e6;padding:6px 9px;font-size:12px;color:#1b2230}.paper .k{background:#eef2f7;color:#1f2f50;font-weight:600;width:28%}
.paper .tt th{background:#1f2f50;color:#fff;font-size:12px}
.ps h4{margin:18px 0 6px;font-size:12.5px;color:#1f2f50;text-transform:uppercase;border-bottom:1px solid #c5d1e6;padding-bottom:3px}.ps ol{margin:0;padding-left:20px}.ps p{margin:0;white-space:pre-line}
.sig{display:grid;margin-top:34px;border:1px solid #c5d1e6}.sig div{min-height:140px;padding:10px;text-align:center;display:flex;flex-direction:column;border-left:1px solid #c5d1e6}.sig div:first-child{border-left:0}
.sig b{color:#1f2f50}.sig small{color:#6b7280}.sig i{margin-top:auto;font-style:normal;font-size:10px;color:#9aa3b2}
.pnote{text-align:center;font-size:10px;color:#9aa3b2;font-style:italic;margin-top:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ed .sec{margin-bottom:14px}.li{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}.li span{width:22px;padding-top:11px;text-align:right;font-weight:600;color:var(--accent-ink)}
.x{border:0;background:none;color:var(--mute);cursor:pointer;min-width:36px;min-height:44px;font-size:18px}.x:hover{color:#d33}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 6px 20px #0004}
.modal{position:fixed;inset:0;background:#0b1220aa;display:grid;place-items:center;padding:16px;z-index:40}.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto}
.bn{display:none}
.soonbox{max-width:620px;text-align:center;padding:36px 24px}.soonbox ul{text-align:left;display:inline-block;color:var(--mute)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid2,.grid-a{grid-template-columns:1fr}
.bn{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bn a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--mute);text-decoration:none;min-height:52px}.bn a.on{color:var(--accent-ink)}
.mtop{display:flex!important}}
.mtop{display:none;align-items:center;gap:10px;margin:-8px 0 14px}.mtop b{font-size:14px}
@media(max-width:600px){.f2{grid-template-columns:1fr}.hide-s{display:none}.sig{grid-template-columns:1fr!important}.sig div{border-left:0;border-top:1px solid #c5d1e6}.sig div:first-child{border-top:0}}

/* Giriş / kayıt ekranı */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .art{background:var(--navy);color:#dfe6f3;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.auth .art h2{font-size:clamp(28px,3vw,40px);line-height:1.15;color:#fff;margin:0 0 14px;text-wrap:balance}
.auth .art p{color:#a9b7cf;max-width:440px;margin:0}
.auth .form{display:grid;place-items:center;padding:32px 20px}
.auth .box{width:min(440px,100%)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{min-height:42px;border:0;border-radius:9px;background:none;cursor:pointer;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.type{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);cursor:pointer;text-align:left;min-height:44px}
.type.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--soft)}
.type b{display:block;font-size:14px}.type small{color:var(--mute);font-size:12.5px}
.err{color:#c62828;font-size:13.5px;margin:-4px 0 12px}
.hint{font-size:12.5px;color:var(--mute);margin-top:12px}
.city{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line)}.city b{font-size:15px}.city small{color:var(--mute)}
.checks{list-style:none;margin:0;padding:0}.checks li{display:flex;gap:8px;font-size:13.5px;padding:2px 0}.checks .ok{color:var(--green)}.checks .no{color:var(--amber)}
.info{background:var(--soft);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 14px}
.paper .band{color:#fff;text-align:center;font-weight:700;font-size:13px;padding:5px;border-radius:3px;margin:0 0 12px}
.paper .tag{font-size:10.5px;color:#9aa3b2;font-style:italic;margin:0}
.paper .closing{font-style:italic;margin:22px 0 0;font-size:12px}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding:10px 16px;border-top:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0 3px 7.5em;text-align:start}.stack td::before{content:attr(data-l);float:left;width:7em;margin-left:-7.5em;color:var(--mute);font-size:12.5px}.stack td.num{text-align:start}}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth .art{padding:28px 20px}.auth .art .big{display:none}}
</style>
</head>

/* ============ Hakediş (gerçek uygulamadaki hakedis/calc.ts) ============ */
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function trNum(v){const s=String(v??'').trim();if(!s)return 0;if(s.includes(','))return Number(s.replace(/\./g,'').replace(',','.'))||0;const p=s.split('.');if(p.length===2&&p[1].length!==3)return Number(s)||0;return Number(s.replace(/\./g,''))||0}
const TL=n=>n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const QT=n=>n.toLocaleString('tr-TR',{maximumFractionDigits:3});
function calcPay(items,vat){const rows=items.map(i=>{const cq=trNum(i.cq),up=trNum(i.up),pq=trNum(i.pq),q=trNum(i.q),cum=r2(pq+q);return{...i,cum,rem:r2(cq-cum),cur:r2(q*up),cumA:r2(cum*up),over:cq>0&&cum>cq+1e-9,contract:cq*up}});
 const sum=k=>r2(rows.reduce((a,r)=>a+r[k],0)),v=Math.max(0,trNum(vat))/100,cur=sum('cur'),cum=sum('cumA'),con=r2(rows.reduce((a,r)=>a+r.contract,0));
 return{rows,t:{cur,cum,con,curV:r2(cur*v),curT:r2(cur*(1+v)),cumV:r2(cum*v),cumT:r2(cum*(1+v)),pct:con>0?r2(cum/con*100):0}}}
function vHakedis(){const d=D();d.payments??=[];
 if(V.pay){const P=d.payments.find(x=>x.id===V.pay);if(!P){V.pay=null;return vHakedis()}const pr=proj(P.project),R=calcPay(P.items,P.vat),lock=P.status==='approved';const overs=R.rows.filter(r=>r.over);
  const inp=(i,k,cls='')=>`<input class="in ${cls}" data-pi="${i}" data-pk="${k}" value="${esc(P.items[i][k])}" ${lock?'disabled':''} ${['cq','up','pq','q'].includes(k)?'inputmode="decimal" style="text-align:right;min-width:84px"':`style="min-width:${{poz:'60px',desc:'240px',unit:'70px'}[k]}"`}>`;
  return`<div class="head"><div><h1>${P.num}. Hakediş</h1><p class="sub">${esc(pr?.name||'')} · ${esc(pr?.city||'')}</p></div><button class="btn sec" id="hback">← Hakedişler</button></div>
  ${lock?'<div class="info">Bu hakediş onaylanmış; düzenlemek için durumu "Taslak" yapın (gerçek sürümde yalnızca Yönetici/Müdür).</div>':''}

function paper(x){const T=TYPES[x.type],c=x.c,p=proj(x.project),co=D().company,A=T.accent;
 const info=[['Belge No',x.num],...(p?[['Proje',p.name],['Proje Kodu',p.code],['İşveren',p.employer],['Şantiye / Şehir',[p.site,p.city].filter(Boolean).join(' — ')]]:[]),['Tarih',fmt(x.date)],...T.f.filter(f=>(f[2]==='text'||f[2]==='date')&&f[0]!=='konu'&&!T.sig.some(s=>s.includes(f[0]))&&c[f[0]]).map(f=>[f[1],f[2]==='date'?fmt(c[f[0]]):c[f[0]]])];
 const secs=T.f.filter(f=>f[3]).map(([k,l,kind,,cols])=>{const v=c[k];if(!v||(Array.isArray(v)&&!v.length))return'';
  if(kind==='photos')return`<h4 style="color:${A}">${l}</h4><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">${v.map((ph,i)=>`<figure style="margin:0;border:1px solid #d9dee7;padding:6px"><img src="${ph.src}" alt="Fotoğraf ${i+1}" style="width:100%;height:160px;object-fit:cover"><figcaption style="font-size:12px;margin-top:6px"><b>Fotoğraf ${i+1}${ph.imalat?' — '+esc(ph.imalat):''}</b>${ph.lokasyon?'<br>'+esc(ph.lokasyon):''}${ph.aciklama?'<br>'+esc(ph.aciklama):''}</figcaption></figure>`).join('')}</div>`;
  if(kind==='list')return`<h4 style="color:${A}">${l}</h4><ol>${v.map(y=>`<li>${esc(y)}</li>`).join('')}</ol>`;
  if(kind==='table')return`<h4 style="color:${A}">${l}</h4><table class="tt"><thead><tr><th style="width:30px;background:${A}">#</th>${cols.map(y=>`<th style="background:${A}">${y[1]}</th>`).join('')}</tr></thead><tbody>${v.map((r,i)=>`<tr><td>${i+1}</td>${cols.map(y=>`<td>${esc(r[y[0]]||'-')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  return`<h4 style="color:${A}">${l}</h4><p>${esc(v)}</p>`}).join('');
 return`<article class="paper"><div class="ph" style="border-color:${A}"><div class="plogo">LOGO</div><div><b style="color:${A}">${esc(co.name)}</b><small>${esc([co.address,co.phone,co.email].filter(Boolean).join('  ·  '))}</small><small>${esc(co.tax||'')}</small></div></div>
 <div class="pt"><h3 style="color:${A}">${T.label.toLocaleUpperCase('tr-TR')}</h3><p class="tag">${T.tag}</p><p>${esc(c.konu||x.title)}</p></div>
 ${T.layout==='gunluk'?`<p class="band" style="background:${A}">RAPOR TARİHİ: ${fmt(x.date)}</p>`:''}
 <table><tbody>${info.map(([k,v])=>`<tr><th class="k">${k}</th><td>${esc(v||'-')}</td></tr>`).join('')}</tbody></table>
 <div class="ps">${secs}</div>${T.closing?`<p class="closing">${esc(T.closing)}</p>`:''}
 <div class="sig" style="grid-template-columns:repeat(${T.sig.length},1fr)">${T.sig.map(([lab,n,ti,cmp])=>`<div><b style="color:${A}">${lab}</b><small>${esc(cmp==='company'?co.name:c[cmp]||'')}</small><span>${esc(c[n]||'Ad Soyad: ..............')}</span><small>${esc(c[ti]||'Unvan: ..............')}</small><i>İmza</i></div>`).join('')}</div>
 ${x.ai?'<p class="pnote">Bu belge yapay zekâ desteğiyle hazırlanmıştır. İçerik, imzalanmadan önce yetkili kişi tarafından kontrol edilmelidir.</p>':''}</article>`}

function vDoc(){const x=D().docs.find(y=>y.id===V.doc);if(!x)return'<div class="empty">Belge bulunamadı.</div>';const T=TYPES[x.type];
 if(V.edit){return`<div class="head"><div><h1>${V.fresh?'Belge hazır — kontrol edin':'Belgeyi düzenle'}</h1><p class="sub">${T.label} · ${esc(x.num)}</p></div></div>
 ${V.fresh&&x.checks?`<div class="card pad" style="margin-bottom:14px;max-width:860px"><b style="display:block;margin-bottom:6px">AI belgeyi göndermeden önce kontrol etti</b><ul class="checks">${x.checks.map(([l,ok,d])=>`<li><span class="${ok?'ok':'no'}">${ok?'✓':'!'}</span><span>${esc(l)}${d?` <span style="color:var(--mute)">— ${esc(d)}</span>`:''}</span></li>`).join('')}</ul></div>`:''}
 ${V.fresh?`<div class="warn" style="margin-bottom:16px;max-width:860px"><b>Kontrol edilmelidir</b><ul>${(x.warn||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}
 <div class="ed" style="max-width:860px"><div class="card pad sec"><div class="f2"><div class="f"><label class="l" for="e-title">Belge başlığı</label><input class="in" id="e-title" value="${esc(x.title)}"></div><div class="f"><label class="l" for="e-date">Tarih</label><input class="in" type="date" id="e-date" value="${x.date}"></div>

 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sv">Kaydet ve Önizle</button><button class="btn sec" id="cancel">Vazgeç</button></div></div>`}
 return`<div class="head"><div><h1>${esc(x.title)}</h1><p class="sub">${T.label} · ${esc(x.num)} ${badge(x.status)} ${x.ai?'<span class="badge b-blue">AI ile oluşturuldu</span>':''}</p></div></div>

function fieldEd([k,l,kind,,cols],v){if(kind==='text')return`<div class="f"><label class="l" for="x-${k}">${l}</label><input class="in" id="x-${k}" data-k="${k}" value="${esc(v||'')}"></div>`;
 if(kind==='date')return`<div class="f"><label class="l" for="x-${k}">${l}</label><input class="in" type="date" id="x-${k}" data-k="${k}" value="${esc(v||'')}"></div>`;
 if(kind==='area')return`<label class="l" for="x-${k}">${l}</label><textarea class="in" id="x-${k}" data-k="${k}" style="min-height:96px">${esc(v||'')}</textarea>`;
if(kind==='photos')return photoField(k,l,v);
 if(kind==='list')return`<label class="l">${l}</label><div data-list="${k}">${(v||[]).map((y,i)=>`<div class="li"><span>${i+1}.</span><textarea class="in" style="min-height:44px">${esc(y)}</textarea><button class="x" data-rm aria-label="Sil">×</button></div>`).join('')}</div><button class="btn sec sm" data-add="${k}">+ Madde ekle</button>`;
 return`<label class="l">${l}</label><div data-table="${k}" data-cols="${cols.map(c=>c[0]).join(',')}" data-labels="${esc(cols.map(c=>c[1]).join('|'))}">${(v||[]).map(r=>`<div class="li">${cols.map(c=>`<input class="in" placeholder="${c[1]}" data-c="${c[0]}" value="${esc(r[c[0]]||'')}">`).join('')}<button class="x" data-rm aria-label="Satırı sil">×</button></div>`).join('')}</div><button class="btn sec sm" data-addrow="${k}">+ Satır ekle</button>`}
function collect(x){x.title=$('#e-title').value.trim()||x.title;x.date=$('#e-date').value||x.date;x.project=$('#e-proj').value;x.status=$('#e-st').value;
 document.querySelectorAll('[data-k]').forEach(e=>x.c[e.dataset.k]=e.value);
 document.querySelectorAll('[data-list]').forEach(e=>x.c[e.dataset.list]=[...e.querySelectorAll('textarea')].map(y=>y.value.trim()).filter(Boolean));
 document.querySelectorAll('[data-photos]').forEach(e=>x.c[e.dataset.photos]=[...e.querySelectorAll('.phi')].map(el=>({src:el.querySelector('img').src,imalat:el.querySelector('[data-ph="imalat"]').value.trim(),lokasyon:el.querySelector('[data-ph="lokasyon"]').value.trim(),aciklama:el.querySelector('[data-ph="aciklama"]').value.trim()})));
 document.querySelectorAll('[data-table]').forEach(e=>x.c[e.dataset.table]=[...e.querySelectorAll('.li')].map(r=>Object.fromEntries([...r.querySelectorAll('input')].map(i=>[i.dataset.c,i.value.trim()]))).filter(r=>Object.values(r).some(Boolean)))}
function docText(x){const T=TYPES[x.type];return[D().company.name,T.label.toLocaleUpperCase('tr-TR'),'Belge No: '+x.num,'Tarih: '+fmt(x.date),'',...T.f.filter(f=>f[3]).map(([k,l,kind,,cols])=>{const v=x.c[k];if(!v||!v.length)return'';return l.toLocaleUpperCase('tr-TR')+'\n'+(kind==='list'?v.map((y,i)=>`${i+1}. ${y}`).join('\n'):kind==='photos'?v.map((y,i)=>`Fotoğraf ${i+1}: ${[y.imalat,y.lokasyon,y.aciklama].filter(Boolean).join(' — ')}`).join('\n'):kind==='table'?v.map((r,i)=>`${i+1}. `+cols.map(c=>r[c[0]]).filter(Boolean).join(' — ')).join('\n'):v)+'\n'}),T.closing||''].join('\n')}

   d.docs.unshift(x);d.ai++;save();a.busy=false;a.res=null;a.type='';openDoc(x.id,true,true)},1100);break}

 if(id==='pastef'){const s=curSheet(),cols=SH[s.kind].cols.filter(c=>c[2]!=='calc');const lines=$('#pastex').value.split(/\r?\n/).filter(l=>l.trim());let n=0;for(const l of lines){const cells=l.split('\t');if(cells.length<2)continue;const r=emptyRow(s.kind);cols.forEach((c,i)=>{if(cells[i]!==undefined){let v=cells[i].trim();if(c[2]==='sel'){const hit=Object.entries(c[4]).find(([a,b])=>norm(b)===norm(v)||a===v);v=hit?hit[0]:r[c[0]]}r[c[0]]=v}});s.rows.push(r);n++}
  s.rows=s.rows.filter(r=>Object.entries(r).some(([k,v])=>v&&!(shDefaults[s.kind]||{})[k]&&k!=='tur'));save();$('#layer').innerHTML='';render();toast(n?n+' satır eklendi.':'Sekmeyle ayrılmış satır bulunamadı.')}},true);
const numOk=v=>{const x=String(v||'').replace(/[\s₺]|TL/gi,'');return!x||/^-?(\d{1,3}(\.\d{3})+|\d+)(,\d+)?$|^-?\d+(\.\d+)?$/.test(x)};
document.addEventListener('input',e=>{if(!S.session||!D())return;const el=e.target;
 if((el.dataset?.pk&&['cq','up','pq','q'].includes(el.dataset.pk))||(el.dataset?.sk&&el.getAttribute('inputmode')==='decimal')){const ok=numOk(el.value);el.style.borderColor=ok?'':'#c62828';el.style.background=ok?'':'#fdecea';el.title=ok?'':'Sayı olarak okunamadı; hesapta 0 kabul edilir'}
 if(el.dataset?.sk){const s=curSheet();if(!s)return;s.rows[+el.dataset.sr][el.dataset.sk]=el.value;if(el.dataset.sk==='personel'){const emp=D().employees.find(x=>x.ad===el.value);const w=document.querySelector(`[data-sr="${el.dataset.sr}"][data-sk="gunluk_ucret"]`);if(emp&&w&&!w.value){w.value=emp.gunluk_ucret;s.rows[+el.dataset.sr].gunluk_ucret=emp.gunluk_ucret}}save();refreshSheet(s);return}
 if(el.dataset?.sm){const s=curSheet();if(!s)return;s.meta[el.dataset.sm]=el.value;save();refreshSheet(s);return}
 if(el.id==='rq'){V.rq=el.value;const pos=el.selectionStart;render();const q=$('#rq');q.focus();q.setSelectionRange(pos,pos)}});

 if(el.id==='ph-in'){const box=document.querySelector('[data-photos]'),files=[...el.files].slice(0,Math.max(0,12-box.children.length));if(el.files.length>files.length)toast('Demo sürümde en fazla 12 fotoğraf eklenebilir.');for(const f of files){try{box.insertAdjacentHTML('beforeend',photoItem({src:await shrink(f)}))}catch{toast('Fotoğraf okunamadı: '+f.name)}}el.value=''}});

/* ============ v6: gerçek AI motoru, kesintiler, Bugün paneli, proje dosyası, görev atama ============ */
const _oldGenerate=generate;
generate=function(t,type,p,date){
 try{if(!window.TOAI)throw 0;const def=TOAI.getDocumentType(type),T=TYPES[type];if(!def||!T)throw 0;
  const d=D(),U=d.user;
  const ctx={companyName:d.company.name||'',userName:U.name,userTitle:U.title,today:date,project:p?{name:p.name,code:p.code,employer:p.employer,site_name:p.site}:undefined};
  const hist=type==='is_teslim_tutanagi'&&p?d.docs.filter(x=>x.type==='gunluk_rapor'&&x.project===p.id).map(x=>TOAI.summarizeDailyReport({document_date:x.date,number:x.num,content:x.c})).filter(h=>h.items.length).sort((a,b)=>a.date.localeCompare(b.date)).slice(-60):[];
  const g=TOAI.mockGeneration(t,type,ctx,hist);
  const source=[t,...hist.flatMap(h=>[...h.items,...h.materials.map(m=>m.quantity+' '+m.name)]),p?.code||'',p?.name||''].join('\n');
  const r=TOAI.reviewDocument(def,TOAI.sanitizeContent(def,g.fields),source);const c=r.content;
  const keys=new Set(def.fields.map(f=>f.key)),miss=T.f.map(f=>f[0]).filter(k=>!keys.has(k));
  if(miss.length){const o=_oldGenerate(t,type,p,date);for(const k of miss)c[k]=o.c[k]}
  return{title:g.title,c,warn:[...g.warnings,...r.warnings,'AI tahmini – kullanıcı tarafından doğrulanmalıdır.'],checks:r.checks.map(x=>[x.label,x.ok,x.detail||'']),hist:hist.length}
 }catch(e){if(e)console.warn('Gerçek motor kullanılamadı:',e);return _oldGenerate(t,type,p,date)}};
const _oldChat=chatReply;

/* ---- Hakediş kesintileri ---- */
function payDeds(P){if(!P.deds){const prev=D().payments.filter(x=>x.project===P.project&&x.num<P.num).sort((a,b)=>b.num-a.num)[0];
  P.deds=prev?.deds?prev.deds.map(x=>({...x,value:x.mode==='amount'?'0':x.value})):[]}return P.deds}
function dedCalc(P){const R=calcPay(P.items,P.vat),ds=payDeds(P).map(x=>({label:x.label||'Kesinti',mode:x.mode,base:x.base,value:trNum(x.value)}));
 const totals={current:R.t.cur,current_vat:R.t.curV,current_with_vat:R.t.curT};
 return window.TOAI?TOAI.calcDeductions(totals,TOAI.sanitizeDeductions(ds)):(()=>{const b={current:totals.current,vat:totals.current_vat,current_with_vat:totals.current_with_vat};const lines=ds.map(x=>({...x,amount:r2(x.mode==='amount'?x.value:b[x.base]*x.value/100)}));const total=r2(lines.reduce((a,l)=>a+l.amount,0));return{lines,total,net_payable:r2(totals.current_with_vat-total)}})()}
const DPRE=[['Teminat kesintisi','percent','current','5'],['Damga vergisi (binde 9,48)','percent','current','0,948'],['KDV tevkifatı (4/10)','percent','vat','40'],['Avans mahsubu','amount','current','0'],['Diğer kesinti','amount','current','0']];
const DBASE={current:'Bu hakediş (KDV hariç)',vat:'Bu hakedişin KDV\'si',current_with_vat:'Bu hakediş (KDV dahil)'};
function dedCard(P){const lock=P.status==='approved',ds=payDeds(P),C=dedCalc(P);
 return`<div class="card pad" id="h-ded" style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h2 style="margin:0;font-size:16px">Kesintiler ve ödenecek tutar</h2>${lock?'':`<div style="display:flex;gap:6px;flex-wrap:wrap">${DPRE.map((x,i)=>`<button class="btn sec sm" data-dadd="${i}">+ ${esc(x[0].replace(/ \(.*/,''))}</button>`).join('')}</div>`}</div>
 ${ds.length?`<div style="display:grid;gap:10px;margin-top:12px">${ds.map((x,i)=>`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px">
 <div class="f" style="margin:0;grid-column:1/-1;display:flex;gap:8px;align-items:center"><input class="in" data-di="${i}" data-dk="label" value="${esc(x.label)}" ${lock?'disabled':''} aria-label="Kesinti adı" style="flex:1;font-weight:600"><b data-dc="${i}" style="white-space:nowrap">${TL(C.lines[i]?.amount||0)}</b>${lock?'':`<button class="x" data-ddel="${i}" aria-label="Kesintiyi sil">×</button>`}</div>
 <div class="f" style="margin:0"><label class="l">Tür</label><select class="in" data-di="${i}" data-dk="mode" ${lock?'disabled':''}><option value="percent">Yüzde (%)</option><option value="amount" ${x.mode==='amount'?'selected':''}>Sabit tutar (₺)</option></select></div>
 ${x.mode==='amount'?'':`<div class="f" style="margin:0"><label class="l">Matrah</label><select class="in" data-di="${i}" data-dk="base" ${lock?'disabled':''}>${Object.entries(DBASE).map(([a,b])=>`<option value="${a}" ${x.base===a?'selected':''}>${b}</option>`).join('')}</select></div>`}
 <div class="f" style="margin:0"><label class="l">${x.mode==='amount'?'Tutar (₺)':'Oran (%)'}</label><input class="in ${String(x.value).trim()&&!isNum(x.value)?'bad':''}" data-di="${i}" data-dk="value" inputmode="decimal" value="${esc(x.value)}" ${lock?'disabled':''} style="text-align:right"></div></div>`).join('')}</div>`:'<p class="hint" style="margin:10px 0 0">Teminat, damga vergisi, KDV tevkifatı, avans mahsubu gibi kesintileri yukarıdaki düğmelerle ekleyin.</p>'}
 <div id="h-net">${netRows(P,C)}</div></div>`}
function netRows(P,C){const R=calcPay(P.items,P.vat);return`<table style="margin-top:12px;max-width:460px;margin-left:auto"><tbody><tr><td>Bu hakediş (KDV dahil)</td><td class="num">${TL(R.t.curT)}</td></tr><tr><td>Toplam kesinti</td><td class="num">− ${TL(C.total)}</td></tr><tr style="font-weight:700;font-size:17px;background:var(--soft)"><td>Ödenecek net tutar</td><td class="num">${TL(C.net_payable)}</td></tr></tbody></table>${C.net_payable<0?'<div class="warn" style="margin-top:8px">Kesintiler hakediş tutarını aşıyor — kontrol edilmelidir.</div>':''}`}
const isNum=v=>window.TOAI?TOAI.isValidTrNumber(String(v)):!isNaN(trNum(v));
function refreshDed(){const P=D().payments.find(x=>x.id===V.pay);if(!P||!$('#h-ded'))return;const C=dedCalc(P);C.lines.forEach((l,i)=>{const e=document.querySelector(`[data-dc="${i}"]`);if(e)e.textContent=TL(l.amount)});$('#h-net').innerHTML=netRows(P,C)}
const _vH=vHakedis;vHakedis=function(){let h=_vH();if(V.pay){const P=D().payments.find(x=>x.id===V.pay);if(P)h=h.replace('<div class="toolbar" style="margin-top:16px">',dedCard(P)+'<div class="toolbar" style="margin-top:16px">')}return h};
const _rP=refreshPay;refreshPay=function(){_rP();refreshDed()};

function myName(){return D().user.name}

 const docs=d.docs.filter(x=>!x.ai||x.id.length>3).slice(0,8).map(x=>({who:U.name,what:(x.status==='final'?'Belgeyi kesinleştirdi':'Belge oluşturdu'),ref:x.num+' · '+x.title,at:Number(x.id.slice(1))||new Date(x.date).getTime()}));
 return[...d.activity,...docs].sort((a,b)=>b.at-a.at).slice(0,8)}

 const mine=d.tasks.filter(t=>t.durum!=='done'&&t.atanan===me).sort((a,b)=>(a.son_tarih||'9').localeCompare(b.son_tarih||'9'));

 return`<div class="grid3" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-bottom:16px">
 <div class="card"><div class="ch"><h2>Bana atanan işler</h2><a href="#gorevler" data-mine="1" class="btn sec sm">Tümü</a></div><div class="list">${mine.length?mine.slice(0,5).map(t=>{const late=t.son_tarih&&t.son_tarih<today;return`<a href="#gorevler" data-mine="1"><div class="grow"><b>${esc(t.baslik)}</b><small>${esc(proj(t.proje)?.name||'Proje yok')}</small></div><span style="font-size:12.5px;white-space:nowrap;${late?'color:#c62828;font-weight:600':'color:var(--mute)'}">${t.son_tarih?fmt(t.son_tarih)+(late?' · gecikti':''):''}</span></a>`}).join(''):'<div class="empty">Size atanmış açık iş yok.</div>'}</div></div>
 <div class="card"><div class="ch"><h2>Bugünün günlük raporu</h2></div><div class="list">${missing.length?missing.map(p=>`<a href="#asistan" data-rp="${p.id}"><div class="grow"><b>${esc(p.name)}</b><small>Bugün rapor yazılmadı</small></div><span class="btn sec sm">Rapor yaz</span></a>`).join(''):'<div class="empty">✓ Tüm aktif projelerin bugünkü raporu yazıldı.</div>'}</div></div>
 <div class="card"><div class="ch"><h2>Ekipte son hareketler</h2></div><div class="list">${activity().map(a=>`<div style="display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line)"><span style="width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none">${esc(a.who.split(' ').map(w=>w[0]).join('').slice(0,2))}</span><div class="grow" style="min-width:0"><b style="font-size:13.5px">${esc(a.who)}</b> <span style="font-size:13.5px">${esc(a.what)}</span><small style="display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.ref)} · ${ago(a.at)}</small></div></div>`).join('')}</div></div></div>`}
const _vD=vDash;vDash=function(){const h=_vD();const i=h.indexOf('<div class="grid2">');return i<0?h+todayPanel():h.slice(0,i)+todayPanel()+h.slice(i)};

function vProje(id){const d=D(),p=proj(id);if(!p){V.pf=null;return vProjeler()}ensure();
 const days=[...Array(28)].map((_,i)=>{const x=new Date(today);x.setDate(x.getDate()-27+i);return x.toISOString().slice(0,10)});
 const gr=d.docs.filter(x=>x.type==='gunluk_rapor'&&x.project===id),pays=d.payments.filter(x=>x.project===id).sort((a,b)=>b.num-a.num),sh=d.sheets.filter(x=>x.project===id),tk=d.tasks.filter(t=>t.proje===id&&t.durum!=='done'),docs=d.docs.filter(x=>x.project===id);
 const done=days.filter(x=>gr.some(g=>g.date===x)).length;
 return`<div class="head"><div><h1>${esc(p.name)}</h1><p class="sub">${esc(p.code)} · ${esc(p.employer||'')} · ${esc(p.site||'')}${p.city?', '+esc(p.city):''}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn ac" href="#asistan" data-rp="${p.id}">Günlük rapor yaz</a><button class="btn sec" id="pfback">← Projeler</button></div></div>
 <div class="card pad" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>Son 28 gün — günlük raporlar</b><small style="color:var(--mute)">${done}/28 gün raporlu</small></div>
 <div style="display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px">${days.map(x=>{const g=gr.find(y=>y.date===x),dt=new Date(x).getDay(),we=dt===0;return g?`<a data-doc="${g.id}" title="${fmt(x)} · ${esc(g.num)}" style="height:30px;border-radius:6px;background:#2E6B4F;color:#fff;display:grid;place-items:center;font-size:11px;text-decoration:none">${+x.slice(8)}</a>`:`<span title="${fmt(x)}${we?' · Pazar':''}" style="height:30px;border-radius:6px;background:${x===today?'var(--amber-bg)':'var(--soft)'};color:var(--mute);display:grid;place-items:center;font-size:11px;${we?'opacity:.55':''}">${+x.slice(8)}</span>`}).join('')}</div><p class="hint" style="margin:8px 0 0">Yeşil günlere tıklayınca rapor açılır. İş bitince "İş Teslim Tutanağı" bu raporlardan otomatik tarihçe çıkarır.</p></div>
 <div class="grid2"><div class="card"><div class="ch"><h2>Hakedişler</h2><a href="#hakedis" class="btn sec sm">Hakediş modülü</a></div><div class="list">${pays.length?pays.map(P=>{const C=dedCalc(P);return`<a data-pfpay="${P.id}"><div class="grow"><b>${P.num}. Hakediş</b><small>${fmt(P.ps)} – ${fmt(P.pe)} · net ${TL(C.net_payable)}</small></div><span class="badge ${P.status==='approved'?'b-final':'b-draft'}">${P.status==='approved'?'Onaylandı':'Taslak'}</span></a>`}).join(''):'<div class="empty">Henüz hakediş yok.</div>'}</div></div>
 <div class="card"><div class="ch"><h2>Açık görevler</h2><a href="#gorevler" class="btn sec sm">Görevler</a></div><div class="list">${tk.length?tk.map(t=>`<a href="#gorevler"><div class="grow"><b>${esc(t.baslik)}</b><small>${esc(t.atanan||'Atanmamış')}${t.son_tarih?' · '+fmt(t.son_tarih):''}</small></div></a>`).join(''):'<div class="empty">Açık görev yok.</div>'}</div></div>
 <div class="card"><div class="ch"><h2>Tablolar (metraj, keşif, teklif, puantaj)</h2></div><div class="list">${sh.length?sh.map(s=>`<a data-pfsh="${s.id}" data-kind="${s.kind}"><div class="grow"><b>${esc(s.title)}</b><small>${esc(s.num||'')} · ${esc(s.kind)}</small></div></a>`).join(''):'<div class="empty">Bu projeye ait tablo yok.</div>'}</div></div>
 <div class="card"><div class="ch"><h2>Belgeler (${docs.length})</h2></div><div class="list">${docRows(docs.slice(0,8))}</div></div></div>`}
